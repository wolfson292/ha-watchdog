# HA watchdog: probes Home Assistant, alerts via Pushover, restarts via SSH with backoff.
#
# GENERATED FILE SOURCE: edit this template or watchdog.py, then run
#   python3 render_compose.py
# to regenerate docker-compose.yml (the script is embedded as a compose config).
#
# Site-specific values and secrets come from environment variables
# (a .env file next to docker-compose.yml, or Portainer stack variables).
# See .env.example.
services:
  ha-watchdog:
    image: python:3.13-alpine
    container_name: ha-watchdog
    restart: unless-stopped
    command: ["sh", "-c", "apk add --no-cache openssh-client >/dev/null && exec python -u /app/watchdog.py"]
    environment:
      HA_URL: ${HA_URL:?set HA_URL, e.g. http://homeassistant.local:8123}
      SSH_HOST: ${SSH_HOST:-}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_USER: ${SSH_USER:-hassio}
      GATEWAY: ${GATEWAY:-}
      MQTT_CANARIES: ${MQTT_CANARIES:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      HA_TOKEN: ${HA_TOKEN:-}
      DRY_RUN: ${DRY_RUN:-0}
      TZ: ${TZ:-UTC}
    volumes:
      - ha-watchdog-data:/data
    configs:
      - source: watchdog_py
        target: /app/watchdog.py
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(time.time()-os.path.getmtime('/tmp/heartbeat') > 300)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    labels:
      autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  ha-watchdog-data:

configs:
  watchdog_py:
    content: |
      # @@WATCHDOG_PY@@
