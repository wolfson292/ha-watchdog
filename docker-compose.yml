# HA watchdog: probes Home Assistant, alerts via Pushover, restarts via SSH with backoff.
#
# Site-specific values and secrets come from environment variables
# (a .env file next to this file, or Portainer stack variables). See .env.example.
services:
  ha-watchdog:
    image: ghcr.io/wolfson292/ha-watchdog:latest
    container_name: ha-watchdog
    restart: unless-stopped
    environment:
      HA_URL: ${HA_URL:?set HA_URL, e.g. http://homeassistant.local:8123}
      SSH_HOST: ${SSH_HOST:-}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_USER: ${SSH_USER:-hassio}
      GATEWAY: ${GATEWAY:-}
      MQTT_CANARIES: ${MQTT_CANARIES:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      HA_TOKEN: ${HA_TOKEN:-}
      DRY_RUN: ${DRY_RUN:-0}
      TZ: ${TZ:-UTC}
    volumes:
      - ha-watchdog-data:/data
    labels:
      autoheal: "true"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  ha-watchdog-data:
